# The issue pipeline's tasks. Each runs in this folder and uses the node version
# from the root mise.toml. Run them from anywhere with
# `mise //apps/issue-pipeline:<task>`. Run `npm ci` at the repo root first.

[tasks.check]
description = "Typecheck, lint, build and run the pipeline's tests"
run = [
  "npm run typecheck",
  "npm run lint",
  "npm run build",
  "node --check install.mjs",
  "node --check dist/ops.mjs",
  "node --check dist/shell-supervisor.mjs",
  "node --check dist/job.mjs",
  "node --check dist/orchestrate.mjs",
  "node --check dist/report.mjs",
  "node --check dist/pipeline-commit.mjs",
  "node --check dist/git-review.mjs",
  "node --check dist/caller-jobs.mjs",
  # Each test fails if it runs past --test-timeout, by its title, rather than
  # hanging the run (#372). The slowest test measured took 51.3 s (the
  # typecheck that fails on a type error, test/typecheck-config.test.mjs) in a
  # full `node --test --test-reporter=spec` run beside three more in a copy of
  # the checkout, at 1-minute load averages of up to 130 on 10 cores
  # (2026-10-17). The timeout is over 3 times that. test/bounded-test-kit.mjs's
  # waitFor deadline and test/job/job-test-kit.mjs's runJob bound sit below it.
  # Bound file-level parallelism independently of the host's core count.
  # Full-flow files also spawn jobs, ops, fake gh and git processes. Node's
  # default (9 files on a 10-core host) oversubscribed those subprocesses:
  # issue #96 verification hit 60 s stage deadlines and 180 s hook deadlines.
  # Keep every test and its deadline; limit resource contention instead.
  "node --test --test-concurrency=2 --test-timeout=180000 'test/**/*.test.mjs'",
]

[tasks.build]
description = "Build src/ into dist/ with esbuild (build.ts)"
run = "npm run build"

[tasks.typecheck]
description = "Typecheck the pipeline's TypeScript with tsc, and the tests and install.mjs as checked JavaScript (tsconfig.test.json)"
run = "npm run typecheck"

[tasks.lint]
description = "Biome with the repo's lint policy"
run = "npm run lint"

[tasks.install]
description = "Install this checkout's pipeline where pi reads it"
run = "node install.mjs"

[tasks."install:dry-run"]
description = "List what install would change, writing nothing"
run = "node install.mjs --dry-run"
