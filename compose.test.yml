name: ecosystem-database-test
services:
  database:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ecosystem_test
      POSTGRES_USER: ecosystem_test
      POSTGRES_PASSWORD: ecosystem_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--username=ecosystem_test", "--dbname=ecosystem_test"]
      interval: 1s
      timeout: 3s
      retries: 30
