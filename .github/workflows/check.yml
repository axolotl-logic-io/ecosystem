name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR cancels that PR's older run, since only its newest
# head can merge. Runs on main always finish.
concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The fast gate of every workspace: typecheck, lint, build. Branch
  # protection requires this job, so keep it fast.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check

  # The issue pipeline's Node tests, split across runners by test file.
  # Each shard builds first, since system tests run the built program.
  test-shard:
    name: tests (shard ${{ matrix.shard }} of 8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: apps/issue-pipeline
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .
      - run: npm run build
      - run: >-
          node --test --test-shard=${{ matrix.shard }}/8
          --test-concurrency=4 --test-timeout=180000
          'test/{component,component-integration,system,acceptance}/**/*.test.ts'

  # One result for all shards, so branch protection can name a single check.
  tests:
    if: always()
    needs: test-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: |
          echo "Shards: $RESULT"
          test "$RESULT" = success

  # The shared database package's checks and the real-database suites,
  # against a disposable PostgreSQL service.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: ecosystem_test
          POSTGRES_USER: ecosystem_test
          POSTGRES_PASSWORD: ecosystem_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ecosystem_test -d ecosystem_test"
          --health-interval 1s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://ecosystem_test:ecosystem_test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/ecosystem_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check --workspace @ecosystem/db
      - run: npm run test:database
